# 正式環境的 nginx server block（掛到 /etc/nginx/conf.d/default.conf）。
#
# 這一層只做兩件事：直接吐 public/ 底下的靜態檔（不必經過 PHP），
# 以及把其餘請求交給 app 容器的 php-fpm。TLS 完全不在這裡處理——
# 憑證由 Cloudflare edge 負責，cloudflared 到 nginx 這一段是容器內部
# 網路，不對外，所以這裡只監聽明文 80。

server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.php;

    charset utf-8;

    # 不要在回應標頭與錯誤頁裡宣告 nginx 版本。
    server_tokens off;

    # 對應 php.ini 的 upload_max_filesize = 12M。兩邊要一起調，
    # 只調 PHP 的話 nginx 會先以 413 擋下來，使用者看到的是一個
    # 沒有中文說明的錯誤頁，而不是「檔案大小不能超過 10MB」。
    client_max_body_size 12M;

    # 這些不會由 Cloudflare 自動補上，在這裡設是最靠近應用程式的地方。
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "same-origin" always;

    # Vite 產出的檔名帶內容雜湊（見 public/build/manifest.json），
    # 內容變了檔名就會變，所以可以放心長時間快取。
    location /build/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # 只有 index.php 這一個進入點會被送去執行。用 ^~ 精確限定路徑，
    # 而不是常見的 `location ~ \.php$`——後者代表「public/ 底下任何
    # 副檔名是 .php 的檔案都可執行」，萬一未來有任何寫入 public/ 的
    # 功能被繞過，那就直接是遠端執行漏洞。這個專案的 public/ 只有
    # index.php 一個 PHP 檔，沒有理由開放更多。
    location ^~ /index.php {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;

        # 全校 Excel 匯入可能跑上一分鐘（對應 php.ini 的
        # max_execution_time = 120），預設 60 秒會在 PHP 還在跑的時候
        # 就回 504。
        fastcgi_read_timeout 120s;

        fastcgi_hide_header X-Powered-By;
    }

    # 上面的 ^~ /index.php 已經涵蓋所有該執行的東西，其餘 .php 一律拒絕。
    location ~ \.php$ {
        return 404;
    }

    # .env、.git 之類的隱藏檔。正常情況下它們根本不在 public/ 底下
    # （root 指向 public，不是專案根目錄），這是純粹的縱深防禦。
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
