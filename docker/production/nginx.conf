# 正式環境的 nginx server block（掛到 /etc/nginx/conf.d/default.conf）。
#
# 這一層只做兩件事：直接吐 public/ 底下的靜態檔（不必經過 PHP），
# 以及把其餘請求交給 app 容器的 php-fpm。TLS 完全不在這裡處理——
# 憑證由 Cloudflare edge 負責，cloudflared 到 nginx 這一段是容器內部
# 網路，不對外，所以這裡只監聽明文 80。

server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.php;

    charset utf-8;

    # 不要在回應標頭與錯誤頁裡宣告 nginx 版本。
    server_tokens off;

    # ------------------------------------------------------------------
    # 還原真實的客戶端 IP
    #
    # 沒有這一段的話，$remote_addr 是 cloudflared 容器的內網位址，
    # 存取記錄裡每一列的來源都長一樣，等於沒有記錄；PHP 收到的
    # REMOTE_ADDR 也一樣。
    #
    # **一定要用 CF-Connecting-IP，不能用 X-Forwarded-For。**
    # Cloudflare 對這兩個標頭的處理方式不同：CF-Connecting-IP 一律被
    # 覆寫成真正的訪客 IP，而 X-Forwarded-For 是「附加」到客戶端原本
    # 送來的內容後面。也就是說訪客自己送一個
    # `X-Forwarded-For: 1.2.3.4` 進來，到達這裡時會變成
    # `1.2.3.4, <真實IP>`，取最左邊那個就會拿到偽造值——實測過確實
    # 如此。稽核紀錄裡的來源 IP 如果可以被偽造，登入紀錄就失去意義了。
    #
    # set_real_ip_from 限定私有網段：能連到這個 nginx 的只有同一個
    # docker network 裡的容器（整套部署沒有對 host 發佈任何 port），
    # 而容器位址一定落在私有網段。寫成網段而不是固定 IP，是因為容器
    # 位址每次重建都會變。
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header CF-Connecting-IP;
    # CF-Connecting-IP 只有單一個值、不是清單，不需要往回追溯。
    real_ip_recursive off;

    # 對應 php.ini 的 upload_max_filesize = 12M。兩邊要一起調，
    # 只調 PHP 的話 nginx 會先以 413 擋下來，使用者看到的是一個
    # 沒有中文說明的錯誤頁，而不是「檔案大小不能超過 10MB」。
    client_max_body_size 12M;

    # 這些不會由 Cloudflare 自動補上，在這裡設是最靠近應用程式的地方。
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "same-origin" always;

    # 校內非公開系統，不要出現在搜尋結果裡。
    #
    # 這個標頭跟 public/robots.txt 是兩件不同的事，兩個都要：
    # robots.txt 說的是「不要抓取」，X-Robots-Tag 說的是「不要索引」。
    # 只靠 robots.txt 的話，網址若從別處被連到，仍可能以「只有網址、
    # 沒有內容」的形式被列進搜尋結果——而且因為抓取被擋住，爬蟲根本
    # 讀不到 noindex。反過來只靠這個標頭，則要等爬蟲真的抓一次才生效。
    #
    # 放在 nginx 而不是 Cloudflare 儀表板：它跟著這份設定檔一起進版本
    # 控制、跟著部署走，不會因為有人動了儀表板設定就默默失效，也不會
    # 在換網域或換 Cloudflare 帳號時消失。
    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;

    # Vite 產出的檔名帶內容雜湊（見 public/build/manifest.json），
    # 內容變了檔名就會變，所以可以放心長時間快取。
    location /build/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";

        # 上面那四個安全標頭必須在這裡「重寫一次」。
        #
        # nginx 的 add_header 只有在「當前層級完全沒有自己的 add_header」
        # 時才會繼承上層——這個 location 為了設 Cache-Control 用了一個
        # add_header，於是 server 層那四個就整組不繼承了。實測過：靜態
        # 資產的回應裡連 X-Content-Type-Options 都沒有。這是 nginx 很容易
        # 踩到的規則，之後若在別的 location 加 add_header，同樣要記得
        # 把這些一起補上。
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "same-origin" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;

        try_files $uri =404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # 只有 index.php 這一個進入點會被送去執行。用 ^~ 精確限定路徑，
    # 而不是常見的 `location ~ \.php$`——後者代表「public/ 底下任何
    # 副檔名是 .php 的檔案都可執行」，萬一未來有任何寫入 public/ 的
    # 功能被繞過，那就直接是遠端執行漏洞。這個專案的 public/ 只有
    # index.php 一個 PHP 檔，沒有理由開放更多。
    location ^~ /index.php {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;

        # 全校 Excel 匯入可能跑上一分鐘（對應 php.ini 的
        # max_execution_time = 120），預設 60 秒會在 PHP 還在跑的時候
        # 就回 504。
        fastcgi_read_timeout 120s;

        fastcgi_hide_header X-Powered-By;
    }

    # 上面的 ^~ /index.php 已經涵蓋所有該執行的東西，其餘 .php 一律拒絕。
    location ~ \.php$ {
        return 404;
    }

    # .env、.git 之類的隱藏檔。正常情況下它們根本不在 public/ 底下
    # （root 指向 public，不是專案根目錄），這是純粹的縱深防禦。
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
