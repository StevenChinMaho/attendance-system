; php-fpm pool 設定，蓋在官方映像的 www.conf 上
; （放在 php-fpm.d/zz-app.conf，字首 zz 確保最後載入）。

[www]
; 官方映像預設監聽 9000 port；容器之間走內部網路，不對 host 發佈，
; 只有同一個 docker network 裡的 nginx 連得到。
listen = 9000

; 讓 PHP 程序（含 php.ini 裡 error_log = /dev/stderr）的輸出真的能被
; `docker compose logs app` 看到。少了 catch_workers_output，
; worker 的 stdout/stderr 會被 fpm master 丟掉。
catch_workers_output = yes
decorate_workers_output = no

; 註：fpm master 自己的 error_log 是**全域**指令，不能寫在 [www] 這個
; pool 區塊裡——寫進來的話 fpm 會以 "unknown entry 'error_log'" 拒絕
; 啟動（踩過一次）。官方映像的 php-fpm.conf 已經把它設成 /proc/self/fd/2
; （也就是 stderr），不需要也不應該在這裡重設。

; 一台校內伺服器、同時線上人數頂多是各班點名的那幾十個人，
; 用固定數量的 worker 比 dynamic 好預測，也不會在尖峰（早自習
; 7:30-7:45 全校一起點名）時才臨時 fork。要調整的話這裡是唯一的地方：
; 每個 worker 最多吃 memory_limit（256M），pm.max_children * 256M
; 不能超過伺服器實際可用記憶體。
pm = static
pm.max_children = 8

; 避免任何潛在的記憶體洩漏累積：每個 worker 處理滿 500 個請求就回收。
pm.max_requests = 500

; 容器的健康檢查用不到 fpm 的 ping/status，不開放，減少一個端點。
