; 正式環境的 PHP 設定，蓋在官方映像的預設值上
; （放在 conf.d/zz-app.ini，字首 zz 確保最後載入）。

; 不要在回應標頭裡宣告 PHP 版本，減少被針對已知漏洞掃描的機會。
expose_php = Off

; 錯誤訊息一律不吐給瀏覽器（APP_DEBUG=false 已經擋住 Laravel 層，
; 這裡是連 PHP 自己的 fatal 都一併擋掉的第二道），改寫到 stderr，
; 由 `docker compose logs` 統一收，容器裡不留會無限長大的 log 檔。
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr

; 跟 config/app.php 的 timezone 一致。Laravel 開機時本來就會呼叫
; date_default_timezone_set()，這行是為了讓 PHP 自己寫的 log 時間戳
; （在 Laravel 開機前發生的錯誤）也是台灣時間，不是 UTC。
date.timezone = Asia/Taipei

; /admin/students/import 的 Livewire 上傳。應用層規則是 max:10240（10MB，
; 見 StudentImporter::rules()）；這裡留一點餘裕，讓超過上限的檔案是被
; Laravel 擋下來並顯示「檔案大小不能超過 10MB」，而不是在 PHP 層就被
; 砍斷、變成一個沒有訊息的失敗。nginx 的 client_max_body_size 也要對應。
upload_max_filesize = 12M
post_max_size = 16M
max_file_uploads = 5

; 全校的 Excel 匯入是這個系統最吃資源的動作（PhpSpreadsheet 會把整張
; 工作表讀進記憶體）。這兩個值是匯入失敗時第一個該調高的地方。
memory_limit = 256M
max_execution_time = 120

; OPcache：正式環境的程式碼是烤進映像裡的、執行期不會變，所以關掉
; 時間戳檢查——每次請求都去 stat 每個檔案是純粹的浪費。代價是「改了
; 檔案不會生效」，但正式環境本來就不該有人去改容器裡的檔案，更新一律
; 走重建映像（見 DEPLOYMENT.md）。
opcache.enable = 1
opcache.enable_cli = 0
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
